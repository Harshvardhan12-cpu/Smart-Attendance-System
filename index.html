<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance ERP - College Portal</title>
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-dark: #12343B;
            --primary: #0F4C5C;
            --bg-app: #F5F7F8;
            --text-primary: #172026;
            --text-secondary: #667085;
            --border-color: #EAECF0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2.5rem 3rem;
            text-align: center;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05);
            max-width: 420px;
            width: 90%;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background-color: var(--primary-dark);
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .system-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 0.25rem;
        }

        .system-tagline {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 0.775rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="logo-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="system-title">Smart Attendance</h1>
        <p class="system-tagline">College ERP Portal</p>
        <div class="spinner"></div>
        <p class="status-text">Verifying session...</p>
    </div>

    <!-- Core Authentication Controller -->
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.AuthService && window.AuthService.isAuthenticated()) {
                    window.location.replace('teacher-dashboard.html');
                } else {
                    window.location.replace('Authentication/login.html');
                }
            }, 150);
        });
    </script>
</body>
</html>
